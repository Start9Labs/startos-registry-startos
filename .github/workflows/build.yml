name: Build

on:
  workflow_dispatch:
  pull_request:
    # The job below skips drafts, and `ready_for_review` is not a default
    # activity type, so without it a draft marked ready is never built.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['*.md']
    branches: ['master']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.
